<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malgré Signature Products</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="store-colors.css">
    <script src="store-images.js"></script>
    <script src="menu.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 700;
            background-color: var(--bg-primary);
            min-height: 100vh;
        }
        
        .page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 100px;
        }
        
        /* Logo at top center */
        .logo-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            cursor: pointer;
        }
        
        .logo-container img {
            height: 80px;
            width: auto;
        }
        
        /* Back Button */
        /* Menu Button */
        .menu-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: var(--btn-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-heavy);
        }
        
        .menu-button:hover {
            transform: scale(1.1);
        }
        
        .menu-icon {
            width: 24px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .menu-icon span {
            width: 100%;
            height: 2px;
            background: var(--btn-text);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        
        .menu-button.active .menu-icon span:nth-child(1) {
            transform: rotate(45deg) translateY(7px);
        }
        
        .menu-button.active .menu-icon span:nth-child(2) {
            opacity: 0;
        }
        
        .menu-button.active .menu-icon span:nth-child(3) {
            transform: rotate(-45deg) translateY(-7px);
        }
        
        /* Side Menu */
        .side-menu {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 100%;
            height: 85vh;
            max-height: none;
            background: var(--menu-bg);
            box-shadow: 0 -5px 25px var(--shadow-heavy);
            z-index: 999;
            transition: bottom 0.4s ease;
            overflow-y: auto;
            padding: 30px;
            border-radius: 30px 30px 0 0;
        }
        
        .side-menu.active {
            bottom: 0;
        }
        
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--popup-overlay);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        
        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        
        .menu-section {
            margin-bottom: 40px;
        }
        
        .menu-section-title {
            font-size: 14px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .menu-item {
            padding: 15px 20px;
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            font-size: 18px;
            color: var(--text-primary);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        
        .menu-item:hover {
            background: var(--card-hover-bg);
            transform: translateX(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        
        .menu-item.active {
            background: var(--card-active-bg);
            color: var(--card-active-text);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        
        /* Main content */
        main {
            flex: 1;
            padding: 2rem 1rem;
        }
        
        .page-title {
            text-align: center;
            font-size: 2.5rem;
            color: var(--text-primary);
            margin-bottom: 3rem;
        }
        
        .products-container {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        
        .product-item {
            display: flex;
            gap: 2rem;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            align-items: center;
        }
        
        .product-item:hover {
            background: var(--card-hover-bg);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px var(--shadow-medium);
        }
        
        .product-image-container {
            flex-shrink: 0;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border-radius: 15px;
            padding: 1rem;
            position: relative;
        }
        
        .product-image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        /* Carousel navigation arrows */
        .carousel-arrow {
            position: absolute;
            width: 35px;
            height: 35px;
            background: var(--btn-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px var(--shadow-medium);
            /* Better touch targets */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        .carousel-arrow:active {
            transform: scale(0.95);
            box-shadow: 0 1px 5px var(--shadow-medium);
        }
        
        .carousel-arrow:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px var(--shadow-heavy);
        }
        
        .carousel-arrow svg {
            width: 20px;
            height: 20px;
            fill: var(--btn-text);
            pointer-events: none;
        }
        
        .carousel-arrow.left {
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .carousel-arrow.left:hover {
            transform: translateY(-50%) scale(1.1);
        }
        
        .carousel-arrow.left:active {
            transform: translateY(-50%) scale(0.95);
        }
        
        .carousel-arrow.right {
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .carousel-arrow.right:hover {
            transform: translateY(-50%) scale(1.1);
        }
        
        .carousel-arrow.right:active {
            transform: translateY(-50%) scale(0.95);
        }
        
        /* Carousel dots indicator */
        .carousel-dots {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
            padding: 5px;
        }
        
        .carousel-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
            /* Better touch targets */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            min-width: 8px;
        }
        
        .carousel-dot:active {
            transform: scale(0.9);
        }
        
        .carousel-dot.active {
            background: var(--text-primary);
            width: 20px;
            border-radius: 4px;
        }
        
        .product-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .product-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .product-description {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.6;
            font-weight: 400;
        }
        
        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }
        
        .product-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .learn-more-btn {
            padding: 0.75rem 2rem;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Cormorant Garamond', Georgia, serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-medium);
        }
        
        .learn-more-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px var(--shadow-heavy);
        }
        
        .learn-more-btn:active {
            transform: scale(0.98);
        }
        
        /* Footer */
        footer {
            padding: 1.5rem 0;
            text-align: center;
            background-color: var(--footer-bg);
        }
        
        .footer-text {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            display: inline-block;
            border-radius: 0.25rem;
            color: var(--footer-text);
            background-color: var(--footer-text-bg);
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .logo-container img {
                height: 60px;
            }
            
            .menu-button {
                width: 45px;
                height: 45px;
                top: 15px;
                left: 15px;
            }
            
            /* Side menu on mobile */
            .side-menu {
                height: 85vh;
                max-height: none;
                padding: 20px;
            }
            
            .page-container {
                padding-top: 90px;
            }
            
            .page-title {
                font-size: 2rem;
                margin-bottom: 2rem;
            }
            
            .products-container {
                gap: 1.5rem;
                padding: 0 1rem;
            }
            
            .product-item {
                flex-direction: column;
                padding: 1.5rem;
                gap: 1.5rem;
            }
            
            .product-image-container {
                width: 100%;
                height: 250px;
            }
            
            .carousel-arrow {
                width: 32px;
                height: 32px;
            }
            
            .carousel-arrow svg {
                width: 18px;
                height: 18px;
            }
            
            .carousel-arrow.left {
                left: 10px;
            }
            
            .carousel-arrow.right {
                right: 10px;
            }
            
            .carousel-dots {
                bottom: 10px;
                padding: 8px;
            }
            
            .carousel-dot {
                width: 10px;
                height: 10px;
                min-width: 10px;
            }
            
            .carousel-dot.active {
                width: 24px;
            }
            
            .product-title {
                font-size: 1.5rem;
            }
            
            .product-description {
                font-size: 0.95rem;
            }
            
            .product-footer {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }
            
            .product-price {
                text-align: center;
                font-size: 1.25rem;
            }
            
            .learn-more-btn {
                width: 100%;
            }
        }
        
        @media (max-width: 480px) {
            .logo-container img {
                height: 50px;
            }
            
            .menu-button {
                width: 40px;
                height: 40px;
                top: 10px;
                left: 10px;
            }
            
            .page-title {
                font-size: 1.75rem;
            }
            
            .product-item {
                padding: 1rem;
            }
            
            .product-image-container {
                height: 200px;
            }
            
            .carousel-arrow {
                width: 30px;
                height: 30px;
            }
            
            .carousel-arrow svg {
                width: 16px;
                height: 16px;
            }
            
            .carousel-arrow.left {
                left: 8px;
            }
            
            .carousel-arrow.right {
                right: 8px;
            }
            
            .carousel-dots {
                bottom: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Logo -->
    <div class="logo-container" onclick="window.location.href='index.html'">
        <img src="L2.png" alt="Malgré Logo" data-image="logo-main">
    </div>
    
    <!-- Menu Button -->
    <div class="menu-button" id="menuButton" onclick="toggleMenu()">
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>

    <!-- Side Menu -->
    <div class="side-menu" id="sideMenu">
        <!-- Menu content will be loaded by menu.js -->
    </div>
    
    <div class="page-container">
        <!-- Main Content -->
        <main>
            <h1 class="page-title">Malgré Signature Collection</h1>
            
            <div class="products-container">
                <!-- Product 1 -->
                <div class="product-item" onclick="goToProduct('product1', event)">
                    <div class="product-image-container">
                        <img src="P1.png" alt="MALGRÉ" class="product-carousel-image" data-product="product1">
                        
                        <!-- Carousel Arrows -->
                        <div class="carousel-arrow left" onclick="event.stopPropagation(); changeProductImage('product1', -1)">
                            <svg viewBox="0 0 24 24">
                                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                            </svg>
                        </div>
                        <div class="carousel-arrow right" onclick="event.stopPropagation(); changeProductImage('product1', 1)">
                            <svg viewBox="0 0 24 24">
                                <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                            </svg>
                        </div>
                        
                        <!-- Carousel Dots -->
                        <div class="carousel-dots">
                            <div class="carousel-dot active" data-product="product1" data-index="0" onclick="event.stopPropagation(); setProductImage('product1', 0)"></div>
                            <div class="carousel-dot" data-product="product1" data-index="1" onclick="event.stopPropagation(); setProductImage('product1', 1)"></div>
                            <div class="carousel-dot" data-product="product1" data-index="2" onclick="event.stopPropagation(); setProductImage('product1', 2)"></div>
                        </div>
                    </div>
                    <div class="product-details">
                        <h3 class="product-title">MALGRÉ</h3>
                        <p class="product-description">Experience luxury and elegance with this exquisite product. Available in three stunning colors to match your unique style.</p>
                        <div class="product-footer">
                            <div class="product-price" data-product="product1">350 SAR</div>
                            <button class="learn-more-btn" onclick="event.stopPropagation(); window.location.href='product.html?product=product1'">Learn More</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Footer -->
        <footer>
            <p class="footer-text">© 2026 All Rights Reserved</p>
        </footer>
    </div>

    <script>
        // toggleMenu function is now in menu.js
        
        // Get country from localStorage
        let currentCountry = 'sa'; // Default to Saudi Arabia
        
        const content = {
            sa: {
                name: 'Saudi Arabia',
                currency: 'SAR',
                products: {
                    product1: 350
                }
            }
        };
        
        // Product images data
        const productImages = {
            product1: ['P1.png', 'P2.png', 'P3.png']
        };
        
        // Current image index for each product
        const currentImageIndex = {
            product1: 0
        };
        
        // Change product image (next/previous)
        function changeProductImage(productId, direction) {
            const images = productImages[productId];
            const maxIndex = images.length - 1;
            
            // Update index
            currentImageIndex[productId] += direction;
            
            // Loop around
            if (currentImageIndex[productId] > maxIndex) {
                currentImageIndex[productId] = 0;
            } else if (currentImageIndex[productId] < 0) {
                currentImageIndex[productId] = maxIndex;
            }
            
            // Update image and dots
            updateProductDisplay(productId);
        }
        
        // Set product image directly
        function setProductImage(productId, index) {
            currentImageIndex[productId] = index;
            updateProductDisplay(productId);
        }
        
        // Update product image and dots
        function updateProductDisplay(productId) {
            const images = productImages[productId];
            const currentIndex = currentImageIndex[productId];
            
            // Update image
            const imgElement = document.querySelector(`img[data-product="${productId}"]`);
            if (imgElement) {
                imgElement.src = images[currentIndex];
            }
            
            // Update dots
            const dots = document.querySelectorAll(`.carousel-dot[data-product="${productId}"]`);
            dots.forEach((dot, index) => {
                if (index === currentIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }
        
        // Go to product page
        function goToProduct(productId, event) {
            // Only navigate if clicking on the card itself, not arrows/dots/button
            if (event.target.closest('.carousel-arrow') || 
                event.target.closest('.carousel-dot') || 
                event.target.closest('.learn-more-btn')) {
                return;
            }
            window.location.href = `product.html?product=${productId}`;
        }
        
        // Update product prices based on country
        function updateProductPrices() {
            const data = content[currentCountry];
            const priceElements = document.querySelectorAll('[data-product]');
            
            priceElements.forEach(element => {
                const productKey = element.getAttribute('data-product');
                if (data.products[productKey] && element.classList.contains('product-price')) {
                    element.textContent = `${data.products[productKey]} ${data.currency}`;
                }
            });
        }
        
        // Initialize prices
        updateProductPrices();
    </script>
</body>
</html>
