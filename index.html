<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malgré</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 700;
            background-color: #fffa87;
            min-height: 100vh;
        }
        
        .page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 100px;
        }
        
        /* Logo at top center */
        .logo-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        
        .logo-container img {
            height: 80px;
            width: auto;
        }
        
        .product-card {
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .product-card:hover {
            transform: scale(1.05);
        }
        
        /* Tutorial Overlay */
        .tutorial-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            display: none;
        }
        
        .tutorial-overlay.show {
            display: block;
        }
        
        /* Spotlight effect for step 2 */
        .tutorial-overlay.step2 {
            background: radial-gradient(
                circle at 180px 180px,
                transparent 0px,
                transparent 180px,
                rgba(0,0,0,0.85) 180px
            );
        }
        
        /* Tutorial Arrow */
        .tutorial-arrow {
            position: fixed;
            z-index: 10000;
        }
        
        .arrow-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        /* Horizontal Arrow pointing right */
        .arrow-horizontal {
            display: flex;
            align-items: center;
        }
        
        .arrow-line-horizontal {
            width: 100px;
            height: 4px;
            background: #fffa87;
            animation: pulse 1.5s infinite;
        }
        
        .arrow-head-horizontal {
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 20px solid #fffa87;
            animation: pulse 1.5s infinite;
        }
        
        .arrow-head-left {
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-right: 20px solid #fffa87;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }
        
        .tutorial-message {
            background: #fffa87;
            color: #000;
            padding: 1rem 1.5rem;
            border-radius: 15px;
            font-size: 1.25rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            white-space: nowrap;
            animation: float 2s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        /* Highlight elements during tutorial */
        .tutorial-highlight {
            position: relative;
            z-index: 10001 !important;
        }
        
        /* Special highlight for menu items */
        .menu-item.tutorial-highlight {
            background: rgba(255,250,135,0.3) !important;
            border: 2px solid #fffa87 !important;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5) !important;
        }
        
        /* Hamburger Menu Button */
        .menu-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .menu-button:hover {
            transform: scale(1.1);
        }
        
        .menu-icon {
            width: 24px;
            height: 18px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .menu-icon span {
            width: 100%;
            height: 3px;
            background: #fffa87;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        
        .menu-button.active .menu-icon span:nth-child(1) {
            transform: rotate(45deg) translateY(7px);
        }
        
        .menu-button.active .menu-icon span:nth-child(2) {
            opacity: 0;
        }
        
        .menu-button.active .menu-icon span:nth-child(3) {
            transform: rotate(-45deg) translateY(-7px);
        }
        
        /* Side Menu - Hidden by default */
        .side-menu {
            position: fixed;
            top: 0;
            left: -350px;
            width: 350px;
            height: 100vh;
            background: #fffa87;
            box-shadow: 5px 0 25px rgba(0,0,0,0.3);
            z-index: 999;
            transition: left 0.4s ease;
            overflow-y: auto;
            padding: 80px 30px 30px;
        }
        
        .side-menu.active {
            left: 0;
        }
        
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        
        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        
        .menu-section {
            margin-bottom: 40px;
        }
        
        .menu-section-title {
            font-size: 14px;
            color: rgba(0,0,0,0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .menu-item {
            padding: 15px 20px;
            background: rgba(0,0,0,0.05);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .menu-item:hover {
            background: rgba(0,0,0,0.1);
            transform: translateX(-5px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }
        
        .menu-item.active {
            background: #000;
            color: #fffa87;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
        
        /* Country Change Popup */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        
        .popup-overlay.show {
            display: flex;
        }
        
        .popup-document {
            width: 350px;
            max-width: 85%;
            height: 400px;
            max-height: 70vh;
            background: rgba(255, 250, 135, 0.95);
            border: 3px solid rgba(0, 0, 0, 0.3);
            box-shadow: 0 30px 80px rgba(0,0,0,0.8);
            position: relative;
            animation: slideIn 0.6s ease;
            backdrop-filter: blur(10px);
        }
        
        .popup-document::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }
        
        .popup-logo {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            animation: logoStamp 0.5s ease 0.5s backwards;
        }
        
        .popup-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            text-align: center;
        }
        
        .popup-flag {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .popup-divider {
            width: 80px;
            height: 2px;
            background: #000;
            margin: 15px auto;
            opacity: 0.4;
        }
        
        .popup-title {
            font-size: 22px;
            font-weight: 700;
            color: #000;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        
        .popup-text {
            font-size: 16px !important;
            font-weight: 600 !important;
            color: #000 !important;
            line-height: 1.6 !important;
        }
        
        .popup-text * {
            color: #000 !important;
        }
        
        /* Main content */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        
        .product-grid {
            max-width: 20rem;
            margin: 0 auto;
        }
        
        .product-image-container {
            padding: 2rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }
        
        .product-image-container img {
            height: 12rem;
            width: auto;
        }
        
        .product-info {
            text-align: center;
            padding-bottom: 1rem;
        }
        
        .product-title {
            font-size: 1rem;
            font-weight: 700;
            color: #000;
            margin-bottom: 0.5rem;
        }
        
        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: #000;
        }
        
        /* Footer */
        footer {
            padding: 1.5rem 0;
            text-align: center;
            background-color: #fffa87;
        }
        
        .footer-text {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            display: inline-block;
            border-radius: 0.25rem;
            color: #fffa87;
            background-color: #000;
        }
        
        /* Cart Summary */
        .cart-summary {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem;
            background-color: #fffa87;
            box-shadow: 0 -25px 50px -12px rgba(0,0,0,0.25);
            z-index: 50;
            display: none;
        }
        
        .cart-summary.show {
            display: block;
        }
        
        .cart-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .cart-total-label {
            font-size: 0.875rem;
            color: #000;
            margin-bottom: 0.25rem;
        }
        
        .cart-total-amount {
            font-size: 1.875rem;
            font-weight: 700;
            color: #000;
        }
        
        .checkout-button {
            background-color: #000;
            color: #fff;
            padding: 1rem 2rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 1.125rem;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            font-family: 'Cormorant Garamond', Georgia, serif;
        }
        
        .checkout-button:hover {
            background-color: #1f2937;
            transform: scale(1.05);
        }
        
        @keyframes slideIn {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes logoStamp {
            from { transform: scale(0) rotate(-90deg); opacity: 0; }
            to { transform: scale(1) rotate(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Tutorial Overlay -->
    <div class="tutorial-overlay" id="tutorialOverlay"></div>
    
    <!-- Tutorial Arrow - Step 1: Point to Menu (from right, pointing left) -->
    <div class="tutorial-arrow" id="tutorialArrow1" style="display: none; top: 30px; left: 120px;">
        <div class="arrow-container" style="flex-direction: row-reverse;">
            <div class="tutorial-message">Click here to open menu</div>
            <div class="arrow-horizontal" style="flex-direction: row-reverse;">
                <div class="arrow-line-horizontal"></div>
                <div class="arrow-head-left"></div>
            </div>
        </div>
    </div>
    
    <!-- Tutorial Arrow - Step 2: Point to Country (from right, pointing left) -->
    <div class="tutorial-arrow" id="tutorialArrow2" style="display: none; top: 150px; left: 370px;">
        <div class="arrow-container" style="flex-direction: row-reverse;">
            <div class="tutorial-message">Choose your country</div>
            <div class="arrow-horizontal" style="flex-direction: row-reverse;">
                <div class="arrow-line-horizontal"></div>
                <div class="arrow-head-left"></div>
            </div>
        </div>
    </div>

    <!-- Menu Button -->
    <div class="menu-button" id="menuButton" onclick="toggleMenu()">
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>

    <!-- Side Menu -->
    <div class="side-menu" id="sideMenu">
        <div class="menu-section">
            <div class="menu-section-title">Country</div>
            <div class="menu-item" id="menu-sa" onclick="selectCountryFromMenu('sa')">
                Saudi Arabia
            </div>
            <div class="menu-item" id="menu-kw" onclick="selectCountryFromMenu('kw')">
                Kuwait
            </div>
        </div>
        
        <div class="menu-section">
            <div class="menu-section-title">Sections</div>
            <div class="menu-item" onclick="window.location.href='product.html'">
                Malgré Signature
            </div>
            <div class="menu-item" onclick="window.location.href='magazine.html'">
                Malgré Magazine
            </div>
            <div class="menu-item" onclick="window.location.href='inquiry.html'">
                Inquiry
            </div>
        </div>
    </div>

    <!-- Popup -->
    <div id="popup" class="popup-overlay">
        <div class="popup-document">
            <div class="popup-logo">
                <img src="L2.png" alt="Malgré Logo" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            
            <div class="popup-content">
                <div id="popupFlag" class="popup-flag">🇸🇦</div>
                <div class="popup-divider"></div>
                <div class="popup-title">COUNTRY CHANGED</div>
                <div id="popupText" class="popup-text" style="color: #000 !important;">From Saudi Arabia to Kuwait</div>
            </div>
        </div>
    </div>

    <!-- Page Container -->
    <div class="page-container">
        <!-- Logo at Top Center -->
        <div class="logo-container">
            <img src="L1.png" alt="Malgré Logo">
        </div>

        <!-- Main Content -->
        <main>
            <div class="product-grid">
                <div class="product-card" onclick="window.location.href='product.html'">
                    <div class="product-image-container">
                        <img src="I1.png" alt="Malgré Product">
                    </div>
                    
                    <div class="product-info">
                        <h3 class="product-title">Malgré Signature</h3>
                        <div class="product-price" id="product-price">450 SAR</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer>
            <p class="footer-text">© 2025 All Rights Reserved</p>
        </footer>
    </div>

    <!-- Cart Summary -->
    <div id="cart-summary" class="cart-summary">
        <div class="cart-content">
            <div>
                <p class="cart-total-label">Total</p>
                <p class="cart-total-amount" id="cart-total">0 SAR</p>
            </div>
            <button class="checkout-button">
                Checkout (<span id="cart-count">0</span> items)
            </button>
        </div>
    </div>

    <script>
        let currentCountry = null; // No default - user must select
        let cart = [];
        
        const content = {
            sa: {
                name: 'Saudi Arabia',
                flag: '🇸🇦',
                currency: 'SAR',
                price: 450,
                phone: '+966 55 206 0478'
            },
            kw: {
                name: 'Kuwait',
                flag: '🇰🇼',
                currency: 'KWD',
                price: 42,
                phone: '+965 55 206 0478'
            }
        };

        // Update menu active state
        function updateMenuActiveState() {
            document.getElementById('menu-sa').classList.remove('active');
            document.getElementById('menu-kw').classList.remove('active');
            
            if (currentCountry === 'sa') {
                document.getElementById('menu-sa').classList.add('active');
            } else if (currentCountry === 'kw') {
                document.getElementById('menu-kw').classList.add('active');
            }
            // If currentCountry is null, no item will be active
        }

        // Toggle menu
        function toggleMenu() {
            const menuButton = document.getElementById('menuButton');
            const sideMenu = document.getElementById('sideMenu');
            const menuOverlay = document.getElementById('menuOverlay');
            
            menuButton.classList.toggle('active');
            sideMenu.classList.toggle('active');
            menuOverlay.classList.toggle('active');
        }

        // Select country from menu
        function selectCountryFromMenu(country) {
            if (currentCountry === country) {
                toggleMenu();
                return;
            }
            
            const oldCountry = currentCountry;
            currentCountry = country;
            
            // Save to localStorage
            localStorage.setItem('selectedCountry', country);
            
            // Update menu
            updateMenuActiveState();
            
            // Close menu
            toggleMenu();
            
            // Show popup
            const popup = document.getElementById('popup');
            const popupFlag = document.getElementById('popupFlag');
            const popupText = document.getElementById('popupText');
            
            popupFlag.textContent = content[country].flag;
            popupText.innerHTML = '<span style="color: #000 !important;">From ' + content[oldCountry].name + ' to ' + content[country].name + '</span>';
            popupText.style.setProperty('color', '#000', 'important');
            
            popup.classList.add('show');
            
            // Update price
            const data = content[country];
            document.getElementById('product-price').textContent = `${data.price} ${data.currency}`;
            
            // Update cart if not empty
            if (cart.length > 0) {
                updateCartDisplay();
            }
            
            // Hide popup after 3 seconds
            setTimeout(() => {
                popup.classList.remove('show');
            }, 3000);
        }

        function goToSection(section) {
            console.log('Going to section:', section);
            toggleMenu();
            // Add navigation logic here
        }

        function addToCart() {
            const data = content[currentCountry];
            cart.push({
                name: 'Malgré Signature',
                price: data.price,
                currency: data.currency
            });
            updateCartDisplay();
        }

        function updateCartDisplay() {
            const data = content[currentCountry];
            const total = cart.length * data.price;
            
            document.getElementById('cart-count').textContent = cart.length;
            document.getElementById('cart-total').textContent = `${total.toFixed(2)} ${data.currency}`;
            document.getElementById('cart-summary').classList.add('show');
        }

        // Initialize
        updateMenuActiveState();
        
        // Tutorial System
        let tutorialStep = 0;
        
        // Start tutorial if no country is selected (must choose country)
        if (!currentCountry) {
            setTimeout(startTutorial, 500);
        }
        
        function startTutorial() {
            tutorialStep = 1;
            showTutorialStep1();
        }
        
        // Step 1: Point to Menu Button
        function showTutorialStep1() {
            document.getElementById('tutorialOverlay').classList.add('show');
            document.getElementById('tutorialArrow1').style.display = 'block';
            document.getElementById('menuButton').classList.add('tutorial-highlight');
        }
        
        // Step 2: Point to Country Selection
        function showTutorialStep2() {
            document.getElementById('tutorialArrow1').style.display = 'none';
            document.getElementById('tutorialArrow2').style.display = 'block';
            document.getElementById('menuButton').classList.remove('tutorial-highlight');
            
            // Add spotlight effect
            document.getElementById('tutorialOverlay').classList.add('step2');
            
            // Highlight country items
            document.getElementById('menu-sa').classList.add('tutorial-highlight');
            document.getElementById('menu-kw').classList.add('tutorial-highlight');
        }
        
        // Complete Tutorial
        function completeTutorial() {
            document.getElementById('tutorialOverlay').classList.remove('show');
            document.getElementById('tutorialOverlay').classList.remove('step2');
            document.getElementById('tutorialArrow1').style.display = 'none';
            document.getElementById('tutorialArrow2').style.display = 'none';
            document.getElementById('menuButton').classList.remove('tutorial-highlight');
            document.getElementById('menu-sa').classList.remove('tutorial-highlight');
            document.getElementById('menu-kw').classList.remove('tutorial-highlight');
            
            // Don't save to localStorage - tutorial should show again if country is not selected
            tutorialStep = 0;
        }
        
        // Override toggleMenu to handle tutorial
        const originalToggleMenu = toggleMenu;
        toggleMenu = function() {
            if (tutorialStep === 1) {
                // First time opening menu during tutorial
                tutorialStep = 2;
                originalToggleMenu();
                setTimeout(showTutorialStep2, 300);
            } else if (tutorialStep === 2) {
                // Don't allow closing menu until country is selected
                return;
            } else {
                originalToggleMenu();
            }
        }
        
        // Override selectCountryFromMenu to complete tutorial
        const originalSelectCountry = selectCountryFromMenu;
        selectCountryFromMenu = function(country) {
            originalSelectCountry(country);
            
            if (tutorialStep === 2) {
                completeTutorial();
            }
        }
    </script>
</body>
</html>
