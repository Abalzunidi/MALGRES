<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malgré</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="store-colors.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 700;
            background-color: var(--bg-primary);
            min-height: 100vh;
        }
        
        .page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 100px;
        }
        
        /* Logo at top center */
        .logo-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        
        .logo-container img {
            height: 80px;
            width: auto;
        }
        
        .product-card {
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .product-card:hover {
            transform: scale(1.05);
        }
        
        /* Country Selection Popup */
        .country-selection-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--popup-overlay);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .country-selection-overlay.show {
            display: flex;
        }
        
        .country-selection-popup {
            background: var(--bg-primary);
            padding: 2rem;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 85%;
            box-shadow: 0 20px 60px var(--shadow-extra);
        }
        
        .country-buttons {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        
        .country-button {
            padding: 1.25rem 2rem;
            font-size: 1.5rem;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 700;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-heavy);
        }
        
        .country-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px var(--shadow-heavy);
        }
        
        .country-button:active {
            transform: scale(0.98);
        }
        
        /* Hamburger Menu Button */
        .menu-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: var(--accent-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-heavy);
        }
        
        .menu-button:hover {
            transform: scale(1.1);
        }
        
        .menu-icon {
            width: 24px;
            height: 18px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .menu-icon span {
            width: 100%;
            height: 3px;
            background: var(--accent-light);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        
        .menu-button.active .menu-icon span:nth-child(1) {
            transform: rotate(45deg) translateY(7px);
        }
        
        .menu-button.active .menu-icon span:nth-child(2) {
            opacity: 0;
        }
        
        .menu-button.active .menu-icon span:nth-child(3) {
            transform: rotate(-45deg) translateY(-7px);
        }
        
        /* Side Menu - Hidden by default */
        .side-menu {
            position: fixed;
            top: 0;
            left: -350px;
            width: 350px;
            height: 100vh;
            background: var(--menu-bg);
            box-shadow: 5px 0 25px var(--shadow-heavy);
            z-index: 999;
            transition: left 0.4s ease;
            overflow-y: auto;
            padding: 80px 30px 30px;
        }
        
        .side-menu.active {
            left: 0;
        }
        
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--popup-overlay);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        
        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        
        .menu-section {
            margin-bottom: 40px;
        }
        
        .menu-section-title {
            font-size: 14px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .menu-item {
            padding: 15px 20px;
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            font-size: 18px;
            box-shadow: 0 4px 10px var(--shadow-medium);
        }
        
        .menu-item:hover {
            background: var(--card-hover-bg);
            transform: translateX(-5px);
            box-shadow: 0 6px 15px var(--shadow-heavy);
        }
        
        .menu-item.active {
            background: var(--card-active-bg);
            color: var(--card-active-text);
            box-shadow: 0 6px 15px var(--shadow-heavy);
        }
        
        /* Country Change Popup */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--popup-overlay);
            backdrop-filter: blur(10px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        
        .popup-overlay.show {
            display: flex;
        }
        
        .popup-document {
            width: 350px;
            max-width: 85%;
            height: 400px;
            max-height: 70vh;
            background: var(--popup-bg);
            border: 3px solid var(--popup-border);
            box-shadow: 0 30px 80px var(--shadow-extra);
            position: relative;
            animation: slideIn 0.6s ease;
            backdrop-filter: blur(10px);
        }
        
        .popup-document::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid var(--border-medium);
        }
        
        .popup-logo {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            animation: logoStamp 0.5s ease 0.5s backwards;
        }
        
        .popup-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            text-align: center;
        }
        
        .popup-flag {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .popup-divider {
            width: 80px;
            height: 2px;
            background: var(--text-primary);
            margin: 15px auto;
            opacity: 0.4;
        }
        
        .popup-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--popup-text);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        
        .popup-text {
            font-size: 16px !important;
            font-weight: 600 !important;
            color: var(--popup-text) !important;
            line-height: 1.6 !important;
        }
        
        .popup-text * {
            color: var(--popup-text) !important;
        }
        
        /* Main content */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        
        .product-grid {
            max-width: 20rem;
            margin: 0 auto;
        }
        
        .product-image-container {
            padding: 2rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }
        
        .product-image-container img {
            height: 12rem;
            width: auto;
        }
        
        .product-info {
            text-align: center;
            padding-bottom: 1rem;
        }
        
        .product-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        /* Footer */
        footer {
            padding: 1.5rem 0;
            text-align: center;
            background-color: var(--footer-bg);
        }
        
        .footer-text {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            display: inline-block;
            border-radius: 0.25rem;
            color: var(--footer-text);
            background-color: var(--footer-text-bg);
        }
        
        /* Cart Summary */
        .cart-summary {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem;
            background-color: var(--bg-primary);
            box-shadow: 0 -25px 50px -12px var(--shadow-medium);
            z-index: 50;
            display: none;
        }
        
        .cart-summary.show {
            display: block;
        }
        
        .cart-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .cart-total-label {
            font-size: 0.875rem;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }
        
        .cart-total-amount {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .checkout-button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            padding: 1rem 2rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 1.125rem;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 20px 25px -5px var(--shadow-light);
            font-family: 'Cormorant Garamond', Georgia, serif;
        }
        
        .checkout-button:hover {
            background-color: var(--btn-hover);
            transform: scale(1.05);
        }
        
        @keyframes slideIn {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes logoStamp {
            from { transform: scale(0) rotate(-90deg); opacity: 0; }
            to { transform: scale(1) rotate(0); opacity: 1; }
        }
        
        /* ===================================
           MOBILE RESPONSIVE STYLES
           =================================== */
        
        @media (max-width: 768px) {
            /* Logo smaller on mobile */
            .logo-container img {
                height: 60px;
            }
            
            /* Menu button smaller */
            .menu-button {
                width: 45px;
                height: 45px;
                top: 15px;
                right: 15px;
            }
            
            /* Side menu full width on mobile */
            .side-menu {
                width: 100%;
                max-width: 100%;
                left: -100%;
            }
            
            .side-menu.active {
                left: 0;
            }
            
            /* Menu items larger touch targets */
            .menu-item {
                padding: 18px 20px;
                font-size: 20px;
            }
            
            .menu-section-title {
                font-size: 16px;
            }
            
            /* Page container more padding */
            .page-container {
                padding-top: 90px;
            }
            
            /* Products container - single column on mobile */
            .products-container {
                grid-template-columns: 1fr !important;
                gap: 1.5rem;
                padding: 1rem;
            }
            
            /* Product cards larger on mobile */
            .product-card {
                padding: 1.5rem;
            }
            
            .product-card img {
                height: 250px;
            }
            
            .product-name {
                font-size: 1.75rem;
            }
            
            .product-price {
                font-size: 1.5rem;
            }
            
            .product-cta {
                font-size: 1.125rem;
                padding: 0.875rem 1.5rem;
            }
            
            /* Popup adjustments */
            .popup-document {
                width: 90%;
                max-width: 350px;
                padding: 2rem 1.5rem;
            }
            
            .popup-logo {
                width: 120px;
                height: 120px;
            }
            
            .popup-title {
                font-size: 1.75rem;
            }
            
            .popup-flag {
                font-size: 3rem;
            }
            
            .popup-text {
                font-size: 1.125rem;
            }
            
            .popup-close {
                font-size: 1.25rem;
                padding: 0.875rem 2rem;
            }
            
            /* Country selection popup */
            .country-selection-popup {
                width: 90%;
                max-width: 320px;
                padding: 1.5rem;
            }
            
            .country-buttons {
                gap: 1rem;
            }
            
            .country-button {
                font-size: 1.25rem;
                padding: 1rem 1.5rem;
            }
        }
        
        /* Tablet landscape */
        @media (min-width: 769px) and (max-width: 1024px) {
            .products-container {
                grid-template-columns: repeat(2, 1fr) !important;
            }
            
            .logo-container img {
                height: 70px;
            }
            
            .product-card img {
                height: 300px;
            }
        }
        
        /* Small phones */
        @media (max-width: 480px) {
            .logo-container img {
                height: 50px;
            }
            
            .menu-button {
                width: 40px;
                height: 40px;
            }
            
            .product-card {
                padding: 1rem;
            }
            
            .product-card img {
                height: 200px;
            }
            
            .product-name {
                font-size: 1.5rem;
            }
            
            .product-price {
                font-size: 1.25rem;
            }
            
            .popup-document {
                width: 95%;
                padding: 1.5rem 1rem;
            }
            
            .popup-logo {
                width: 100px;
                height: 100px;
            }
            
            .popup-title {
                font-size: 1.5rem;
            }
            
            /* Country selection popup */
            .country-selection-popup {
                width: 95%;
                max-width: 280px;
                padding: 1.25rem;
            }
            
            .country-buttons {
                gap: 0.875rem;
            }
            
            .country-button {
                font-size: 1.125rem;
                padding: 0.875rem 1.25rem;
            }
        }
    </style>
</head>
<body>

    <!-- Country Selection Popup -->
    <div class="country-selection-overlay" id="countrySelectionOverlay">
        <div class="country-selection-popup">
            <div class="country-buttons">
                <button class="country-button" onclick="selectCountryFromPopup('sa')">
                    Saudi Arabia
                </button>
                <button class="country-button" onclick="selectCountryFromPopup('kw')">
                    Kuwait
                </button>
            </div>
        </div>
    </div>

    <!-- Menu Button -->
    <div class="menu-button" id="menuButton" onclick="toggleMenu()">
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>

    <!-- Side Menu -->
    <div class="side-menu" id="sideMenu">
        <div class="menu-section">
            <div class="menu-section-title">Country</div>
            <div class="menu-item" id="menu-sa" onclick="selectCountryFromMenu('sa')">
                Saudi Arabia
            </div>
            <div class="menu-item" id="menu-kw" onclick="selectCountryFromMenu('kw')">
                Kuwait
            </div>
        </div>
        
        <div class="menu-section">
            <div class="menu-section-title">Sections</div>
            <div class="menu-item" onclick="window.location.href='product.html'">
                Malgré Signature
            </div>
            <div class="menu-item" onclick="window.location.href='magazine.html'">
                Malgré Magazine
            </div>
            <div class="menu-item" onclick="window.location.href='inquiry.html'">
                Inquiry
            </div>
        </div>
    </div>

    <!-- Popup -->
    <div id="popup" class="popup-overlay">
        <div class="popup-document">
            <div class="popup-logo">
                <img src="L2.png" alt="Malgré Logo" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            
            <div class="popup-content">
                <div id="popupFlag" class="popup-flag">🇸🇦</div>
                <div class="popup-divider"></div>
                <div class="popup-title">COUNTRY CHANGED</div>
                <div id="popupText" class="popup-text">From Saudi Arabia to Kuwait</div>
            </div>
        </div>
    </div>

    <!-- Page Container -->
    <div class="page-container">
        <!-- Logo at Top Center -->
        <div class="logo-container">
            <img src="L1.png" alt="Malgré Logo">
        </div>

        <!-- Main Content -->
        <main>
            <div class="product-grid">
                <div class="product-card" onclick="window.location.href='product.html'">
                    <div class="product-image-container">
                        <img src="I1.png" alt="Malgré Product">
                    </div>
                    
                    <div class="product-info">
                        <h3 class="product-title">Malgré Signature</h3>
                        <div class="product-price" id="product-price">450 SAR</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer>
            <p class="footer-text">© 2025 All Rights Reserved</p>
        </footer>
    </div>

    <!-- Cart Summary -->
    <div id="cart-summary" class="cart-summary">
        <div class="cart-content">
            <div>
                <p class="cart-total-label">Total</p>
                <p class="cart-total-amount" id="cart-total">0 SAR</p>
            </div>
            <button class="checkout-button">
                Checkout (<span id="cart-count">0</span> items)
            </button>
        </div>
    </div>

    <script>
        let currentCountry = null; // No default - user must select
        let cart = [];
        
        const content = {
            sa: {
                name: 'Saudi Arabia',
                flag: '🇸🇦',
                currency: 'SAR',
                price: 450,
                phone: '+966 55 206 0478'
            },
            kw: {
                name: 'Kuwait',
                flag: '🇰🇼',
                currency: 'KWD',
                price: 42,
                phone: '+965 55 206 0478'
            }
        };

        // Update menu active state
        function updateMenuActiveState() {
            document.getElementById('menu-sa').classList.remove('active');
            document.getElementById('menu-kw').classList.remove('active');
            
            if (currentCountry === 'sa') {
                document.getElementById('menu-sa').classList.add('active');
            } else if (currentCountry === 'kw') {
                document.getElementById('menu-kw').classList.add('active');
            }
            // If currentCountry is null, no item will be active
        }

        // Toggle menu
        function toggleMenu() {
            const menuButton = document.getElementById('menuButton');
            const sideMenu = document.getElementById('sideMenu');
            const menuOverlay = document.getElementById('menuOverlay');
            
            menuButton.classList.toggle('active');
            sideMenu.classList.toggle('active');
            menuOverlay.classList.toggle('active');
        }

        // Select country from menu
        function selectCountryFromMenu(country) {
            if (currentCountry === country) {
                toggleMenu();
                return;
            }
            
            const oldCountry = currentCountry;
            currentCountry = country;
            
            // Save to localStorage
            localStorage.setItem('selectedCountry', country);
            
            // Update menu
            updateMenuActiveState();
            
            // Close menu
            toggleMenu();
            
            // Show popup only if there was a previous country
            if (oldCountry !== null) {
                const popup = document.getElementById('popup');
                const popupFlag = document.getElementById('popupFlag');
                const popupText = document.getElementById('popupText');
                
                popupFlag.textContent = content[country].flag;
                popupText.innerHTML = '<span>From ' + content[oldCountry].name + ' to ' + content[country].name + '</span>';
                
                popup.classList.add('show');
            }
            
            // Update price
            const data = content[country];
            document.getElementById('product-price').textContent = `${data.price} ${data.currency}`;
            
            // Update cart if not empty
            if (cart.length > 0) {
                updateCartDisplay();
            }
            
            // Hide popup after 3 seconds
            setTimeout(() => {
                popup.classList.remove('show');
            }, 3000);
        }

        function goToSection(section) {
            console.log('Going to section:', section);
            toggleMenu();
            // Add navigation logic here
        }

        function addToCart() {
            const data = content[currentCountry];
            cart.push({
                name: 'Malgré Signature',
                price: data.price,
                currency: data.currency
            });
            updateCartDisplay();
        }

        function updateCartDisplay() {
            const data = content[currentCountry];
            const total = cart.length * data.price;
            
            document.getElementById('cart-count').textContent = cart.length;
            document.getElementById('cart-total').textContent = `${total.toFixed(2)} ${data.currency}`;
            document.getElementById('cart-summary').classList.add('show');
        }

        // Initialize
        updateMenuActiveState();
        
        // Show country selection popup if no country is selected
        if (!currentCountry) {
            setTimeout(() => {
                document.getElementById('countrySelectionOverlay').classList.add('show');
            }, 300);
        }
        
        // Select country from popup
        function selectCountryFromPopup(country) {
            currentCountry = country;
            localStorage.setItem('selectedCountry', country);
            
            // Hide popup
            document.getElementById('countrySelectionOverlay').classList.remove('show');
            
            // Update menu
            updateMenuActiveState();
            
            // Update price
            const data = content[country];
            document.getElementById('product-price').textContent = `${data.price} ${data.currency}`;
        }
    </script>
</body>
</html>
