<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malgré</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 700;
            background-color: #fffa87;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
        }
        
        .product-card {
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .product-card:hover {
            transform: scale(1.05);
        }
        
        /* Toggle Switch - Single Slider */
        .toggle-container {
            position: relative;
            width: 180px;
            height: 50px;
            background: rgba(0,0,0,0.15);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .toggle-container.active {
            background: #2d8a2d;
        }
        
        .toggle-slider {
            position: absolute;
            width: 90px;
            height: 50px;
            background: #2d8a2d;
            border-radius: 25px;
            top: 0;
            left: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        .toggle-container.kw .toggle-slider {
            left: 90px;
        }
        
        .toggle-option {
            position: absolute;
            width: 90px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 24px;
            font-weight: 700;
            transition: all 0.3s ease;
            z-index: 1;
        }
        
        .toggle-option.left {
            left: 0;
        }
        
        .toggle-option.right {
            right: 0;
        }
        
        .toggle-option span {
            font-size: 13px;
            color: rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        
        .toggle-container:not(.kw) .toggle-option.left span,
        .toggle-container.kw .toggle-option.right span {
            color: #fff;
            font-weight: 700;
        }
        
        /* Black Document Popup */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        
        .popup-overlay.show {
            display: flex;
        }
        
        .popup-document {
            width: 500px;
            height: 600px;
            background: rgba(255, 250, 135, 0.95);
            border: 3px solid rgba(0, 0, 0, 0.3);
            box-shadow: 0 30px 80px rgba(0,0,0,0.8);
            position: relative;
            animation: slideIn 0.6s ease;
            backdrop-filter: blur(10px);
        }
        
        .popup-document::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }
        
        .popup-logo {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 90px;
            height: 90px;
            animation: logoStamp 0.5s ease 0.5s backwards;
        }
        
        .popup-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            text-align: center;
        }
        
        .popup-flag {
            font-size: 90px;
            margin-bottom: 20px;
        }
        
        .popup-divider {
            width: 100px;
            height: 2px;
            background: #000;
            margin: 20px auto;
            opacity: 0.4;
        }
        
        .popup-title {
            font-size: 32px;
            font-weight: 700;
            color: #000;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }
        
        .popup-text {
            font-size: 20px !important;
            font-weight: 600 !important;
            color: #000 !important;
            line-height: 1.6 !important;
        }
        
        .popup-text * {
            color: #000 !important;
        }
        
        /* Utility classes */
        .container { max-width: 1200px; margin: 0 auto; }
        .mx-auto { margin-left: auto; margin-right: auto; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
        .py-12 { padding-top: 3rem; padding-bottom: 3rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mt-4 { margin-top: 1rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .flex { display: flex; }
        .grid { display: grid; }
        .hidden { display: none; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .flex-col { flex-direction: column; }
        .text-center { text-align: center; }
        .text-sm { font-size: 0.875rem; }
        .text-xs { font-size: 0.75rem; }
        .text-base { font-size: 1rem; }
        .text-xl { font-size: 1.25rem; }
        .text-3xl { font-size: 1.875rem; }
        .font-bold { font-weight: 700; }
        .text-black { color: #000; }
        .text-white { color: #fff; }
        .bg-black { background-color: #000; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-full { border-radius: 9999px; }
        .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .sticky { position: sticky; }
        .fixed { position: fixed; }
        .relative { position: relative; }
        .top-0 { top: 0; }
        .bottom-0 { bottom: 0; }
        .left-0 { left: 0; }
        .right-0 { right: 0; }
        .z-50 { z-index: 50; }
        .w-40 { width: 10rem; }
        .h-20 { height: 5rem; }
        .h-48 { height: 12rem; }
        .w-auto { width: auto; }
        .max-w-xs { max-width: 20rem; }
        .overflow-hidden { overflow: hidden; }
        .hover\:opacity-70:hover { opacity: 0.7; }
        .hover\:bg-gray-800:hover { background-color: #1f2937; }
        .hover\:scale-105:hover { transform: scale(1.05); }
        .transition-colors { transition-property: color, background-color, border-color; transition-duration: 0.15s; }
        .transition-all { transition-property: all; transition-duration: 0.15s; }
        .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        @media (min-width: 768px) {
            .md\:grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        }
        @media (min-width: 1024px) {
            .lg\:grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        }
        
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        footer {
            padding: 1.5rem 0;
            text-align: center;
        }
        
        @keyframes slideIn {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes logoStamp {
            from { transform: scale(0) rotate(-90deg); opacity: 0; }
            to { transform: scale(1) rotate(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Popup -->
    <div id="popup" class="popup-overlay">
        <div class="popup-document">
            <div class="popup-logo">
                <img src="L2.png" alt="Malgré Logo" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            
            <div class="popup-content">
                <div id="popupFlag" class="popup-flag">🇸🇦</div>
                <div class="popup-divider"></div>
                <div class="popup-title">COUNTRY CHANGED</div>
                <div id="popupText" class="popup-text" style="color: #000 !important;">From Saudi Arabia to Kuwait</div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="shadow-2xl sticky top-0 z-50" style="background-color: #fffa87;">
        <div class="container mx-auto px-4 py-2">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-40 h-20 flex items-center justify-center">
                        <img src="L1.png" alt="Malgré Logo" class="h-20 w-auto">
                    </div>
                </div>
                
                <div class="flex items-center gap-6">
                    <!-- Single Toggle Slider -->
                    <div id="toggle" class="toggle-container" onclick="toggleCountry()">
                        <div class="toggle-slider"></div>
                        <div class="toggle-option left">
                            🇸🇦
                        </div>
                        <div class="toggle-option right">
                            🇰🇼
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Products Grid -->
    <main class="container mx-auto px-4">
        <div class="grid grid-cols-1 md:grid-cols-1 lg:grid-cols-1 gap-4 max-w-xs mx-auto">
            <div class="product-card bg-transparent rounded-xl overflow-hidden" onclick="addToCart()">
                <div class="relative p-8">
                    <div class="text-8xl text-center mb-4 flex items-center justify-center">
                        <img src="I1.png" alt="Malgré Product" class="h-48 w-auto">
                    </div>
                </div>
                
                <div class="text-center pb-4">
                    <h3 class="text-base font-bold text-black mb-2">Malgré Signature</h3>
                    <div class="text-xl font-bold text-black" id="product-price">450 SAR</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer style="background-color: #fffa87;">
        <div class="container mx-auto px-4">
            <p class="text-xs px-3 py-1 inline-block rounded" style="color: #fffa87; background-color: #000;">© 2025 All Rights Reserved</p>
        </div>
    </footer>

    <!-- Cart Summary -->
    <div id="cart-summary" class="fixed bottom-0 left-0 right-0 p-6 shadow-2xl hidden" style="background-color: #fffa87;">
        <div class="container mx-auto flex items-center justify-between">
            <div>
                <p class="text-sm text-black mb-1">Total</p>
                <p class="text-3xl font-bold text-black" id="cart-total">0 SAR</p>
            </div>
            <button class="bg-black text-white px-8 py-4 rounded-full font-bold text-lg hover:bg-gray-800 transition-all hover:scale-105 shadow-xl">
                Checkout (<span id="cart-count">0</span> items)
            </button>
        </div>
    </div>

    <script>
        let currentCountry = 'sa';
        let cart = [];
        
        const content = {
            sa: {
                name: 'Saudi Arabia',
                flag: '🇸🇦',
                currency: 'SAR',
                price: 450,
                phone: '+966 55 206 0478'
            },
            kw: {
                name: 'Kuwait',
                flag: '🇰🇼',
                currency: 'KWD',
                price: 42,
                phone: '+965 55 206 0478'
            }
        };

        function toggleCountry() {
            const toggle = document.getElementById('toggle');
            
            if (currentCountry === 'sa') {
                toggle.classList.add('kw');
                switchCountry('kw');
            } else {
                toggle.classList.remove('kw');
                switchCountry('sa');
            }
        }
        
        function switchCountry(country) {
            if (currentCountry === country) return;
            
            const oldCountry = currentCountry;
            currentCountry = country;
            
            // Show popup
            const popup = document.getElementById('popup');
            const popupFlag = document.getElementById('popupFlag');
            const popupText = document.getElementById('popupText');
            
            popupFlag.textContent = content[country].flag;
            
            // Force black color
            popupText.innerHTML = '<span style="color: #000 !important;">From ' + content[oldCountry].name + ' to ' + content[country].name + '</span>';
            popupText.style.setProperty('color', '#000', 'important');
            
            popup.classList.add('show');
            
            // Update price
            const data = content[country];
            document.getElementById('product-price').textContent = `${data.price} ${data.currency}`;
            
            // Update cart if not empty
            if (cart.length > 0) {
                updateCartDisplay();
            }
            
            // Hide popup after 3 seconds
            setTimeout(() => {
                popup.classList.remove('show');
            }, 3000);
        }

        function addToCart() {
            const data = content[currentCountry];
            cart.push({
                name: 'Malgré Signature',
                price: data.price,
                currency: data.currency
            });
            updateCartDisplay();
        }

        function updateCartDisplay() {
            const data = content[currentCountry];
            const total = cart.length * data.price;
            
            document.getElementById('cart-count').textContent = cart.length;
            document.getElementById('cart-total').textContent = `${total.toFixed(2)} ${data.currency}`;
            document.getElementById('cart-summary').classList.remove('hidden');
        }
    </script>
</body>
</html>
