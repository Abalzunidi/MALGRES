<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malgré Magazine</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="store-colors.css">
    <script src="store-images.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 700;
            background-color: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Logo at top center */
        .logo-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            cursor: pointer;
        }
        
        .logo-container img {
            height: 80px;
            width: auto;
        }
        
        /* Menu Button */
        .menu-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: var(--btn-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-heavy);
        }
        
        .menu-button:hover {
            transform: scale(1.1);
        }
        
        .menu-icon {
            width: 24px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .menu-icon span {
            width: 100%;
            height: 2px;
            background: var(--btn-text);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        
        .menu-button.active .menu-icon span:nth-child(1) {
            transform: rotate(45deg) translateY(7px);
        }
        
        .menu-button.active .menu-icon span:nth-child(2) {
            opacity: 0;
        }
        
        .menu-button.active .menu-icon span:nth-child(3) {
            transform: rotate(-45deg) translateY(-7px);
        }
        
        /* Side Menu */
        .side-menu {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 100%;
            height: 85vh;
            max-height: none;
            background: var(--menu-bg);
            box-shadow: 0 -5px 25px var(--shadow-heavy);
            z-index: 999;
            transition: bottom 0.4s ease;
            overflow-y: auto;
            padding: 30px;
            border-radius: 30px 30px 0 0;
        }
        
        .side-menu.active {
            bottom: 0;
        }
        
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--popup-overlay);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        
        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        
        .menu-section {
            margin-bottom: 40px;
        }
        
        .menu-section-title {
            font-size: 14px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .menu-item {
            padding: 15px 20px;
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            font-size: 18px;
            color: var(--text-primary);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        
        .menu-item:hover {
            background: var(--card-hover-bg);
            transform: translateX(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        
        .menu-item.active {
            background: var(--card-active-bg);
            color: var(--card-active-text);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        
        /* Main content */
        .magazine-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 1rem 100px;
        }
        
        .magazine-image-container {
            width: 100%;
            max-width: 600px;
            margin-bottom: 2rem;
            position: relative;
        }
        
        .magazine-image {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 20px;
            box-shadow: 0 10px 40px var(--shadow-medium);
        }
        
        /* Page indicator */
        .page-indicator {
            font-size: 1.25rem;
            color: var(--text-light);
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }
        
        /* Next/Done Button */
        .action-button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            padding: 1rem 3rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.25rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-heavy);
            font-family: 'Cormorant Garamond', Georgia, serif;
        }
        
        .action-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px var(--shadow-heavy);
        }
        
        .action-button:active {
            transform: scale(0.98);
        }
        
        /* Footer */
        footer {
            padding: 1.5rem 0;
            text-align: center;
            background-color: var(--footer-bg);
        }
        
        .footer-text {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            display: inline-block;
            border-radius: 0.25rem;
            color: var(--footer-text);
            background-color: var(--footer-text-bg);
        }
        
        /* ===================================
           MOBILE RESPONSIVE STYLES
           =================================== */
        
        @media (max-width: 768px) {
            /* Header elements */
            .logo-container img {
                height: 60px;
            }
            
            .back-button {
                width: 45px;
                height: 45px;
                top: 15px;
                left: 15px;
            }
            
            /* Page container */
            .page-container {
                padding-top: 90px;
            }
            
            /* Magazine content */
            .magazine-content {
                padding: 1rem;
            }
            
            /* Magazine image responsive */
            .magazine-image {
                max-width: 100%;
                height: auto;
                border-radius: 15px;
            }
            
            /* Navigation buttons */
            .nav-button {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }
            
            .nav-button.prev {
                left: 10px;
            }
            
            .nav-button.next {
                right: 10px;
            }
            
            /* Page indicator */
            .page-indicator {
                font-size: 1rem;
                padding: 0.75rem 1.25rem;
                bottom: 15px;
            }
        }
        
        /* Small phones */
        @media (max-width: 480px) {
            .logo-container img {
                height: 50px;
            }
            
            .back-button {
                width: 40px;
                height: 40px;
            }
            
            .magazine-content {
                padding: 0.5rem;
            }
            
            .nav-button {
                width: 45px;
                height: 45px;
                font-size: 1.25rem;
            }
            
            .nav-button.prev {
                left: 5px;
            }
            
            .nav-button.next {
                right: 5px;
            }
            
            .page-indicator {
                font-size: 0.875rem;
                padding: 0.625rem 1rem;
                bottom: 10px;
            }
        }
        
        /* Tablet landscape */
        @media (min-width: 769px) and (max-width: 1024px) {
            .logo-container img {
                height: 70px;
            }
            
            .magazine-image {
                max-height: 80vh;
            }
        }
    </style>
</head>
<body>

    <!-- Logo at Top Center -->
    <div class="logo-container" onclick="window.location.href='index.html'">
        <img src="L2.png" alt="Malgré Logo" data-image="logo-main">
    </div>

    <!-- Menu Button -->
    <div class="menu-button" id="menuButton" onclick="toggleMenu()">
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>

    <!-- Side Menu -->
    <div class="side-menu" id="sideMenu">
        <!-- Collection Section -->
        <div class="menu-section">
            <div class="menu-section-title">Collection</div>
            <div class="menu-item" onclick="window.location.href='products.html'">
                Malgré Collection
            </div>
        </div>
        
        <!-- Explore Section -->
        <div class="menu-section">
            <div class="menu-section-title">Explore</div>
            <div class="menu-item active">
                Magazine
            </div>
            <div class="menu-item" onclick="window.location.href='inquiry.html'">
                Inquiry
            </div>
            <div class="menu-item" onclick="window.location.href='locations.html'">
                Locations
            </div>
        </div>
        
        <!-- Information Section -->
        <div class="menu-section">
            <div class="menu-section-title">Information</div>
            <div class="menu-item" onclick="window.location.href='contact.html'">
                Email
            </div>
            <div class="menu-item" onclick="window.location.href='returns.html'">
                Return Policy
            </div>
            <div class="menu-item" onclick="window.location.href='privacy.html'">
                Privacy Policy
            </div>
            <div class="menu-item" onclick="window.location.href='vision.html'">
                Our Vision
            </div>
            <div class="menu-item" onclick="window.location.href='sponsorship.html'">
                Sponsorship
            </div>
        </div>
    </div>

    <!-- Magazine Content -->
    <div class="magazine-container">
        <div class="magazine-image-container">
            <img src="I1.png" alt="Magazine Page" class="magazine-image" id="magazineImage" data-image="magazine-page" data-page="1">
        </div>
        
        <div class="page-indicator" id="pageIndicator">1 / 5</div>
        
        <button class="action-button" id="actionButton" onclick="nextPage()">Next</button>
    </div>

    <!-- Footer -->
    <footer>
        <p class="footer-text">© 2026 All Rights Reserved</p>
    </footer>

    <script>
        let currentPage = 1;
        const totalPages = 5;
        
        // Menu toggle
        function toggleMenu() {
            const menuButton = document.getElementById('menuButton');
            const sideMenu = document.getElementById('sideMenu');
            const menuOverlay = document.getElementById('menuOverlay');
            
            menuButton.classList.toggle('active');
            sideMenu.classList.toggle('active');
            menuOverlay.classList.toggle('active');
        }
        
        // Use magazine images from STORE_IMAGES
        const magazineImages = STORE_IMAGES.magazine.pages;
        
        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                updatePage();
            } else {
                // Last page - go back to home
                window.location.href = 'index.html';
            }
        }
        
        function updatePage() {
            // Update image
            document.getElementById('magazineImage').src = magazineImages[currentPage - 1];
            
            // Update page indicator
            document.getElementById('pageIndicator').textContent = `${currentPage} / ${totalPages}`;
            
            // Update button text
            const actionButton = document.getElementById('actionButton');
            if (currentPage === totalPages) {
                actionButton.textContent = 'Done';
            } else {
                actionButton.textContent = 'Next';
            }
        }
        
        // Initialize
        updatePage();
    </script>
</body>
</html>
