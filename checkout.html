<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Malgré</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="store-colors.css">
    <script src="store-images.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 700;
            background-color: var(--bg-primary);
            min-height: 100vh;
        }
        
        .page-container {
            min-height: 100vh;
            padding-top: 100px;
            padding-bottom: 3rem;
        }
        
        .logo-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            cursor: pointer;
        }
        
        .logo-container img {
            height: 80px;
            width: auto;
        }
        
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: var(--btn-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-heavy);
        }
        
        .back-button:hover {
            transform: scale(1.1);
        }
        
        .back-button svg {
            width: 24px;
            height: 24px;
            fill: var(--btn-text);
        }
        
        .checkout-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
        }
        
        @media (max-width: 968px) {
            .checkout-content {
                grid-template-columns: 1fr;
            }
        }
        
        .checkout-form {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 2.5rem;
            box-shadow: 0 10px 40px var(--shadow-light);
        }
        
        .form-section {
            margin-bottom: 2.5rem;
        }
        
        .section-title {
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-label {
            display: block;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }
        
        .form-input,
        .form-select {
            width: 100%;
            padding: 0.875rem;
            font-size: 1rem;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 600;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 15px;
            transition: all 0.3s ease;
            color: var(--input-text);
        }
        
        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--input-focus-border);
            background: var(--input-focus-bg);
        }
        
        .form-select {
            cursor: pointer;
        }
        
        /* Make select dropdown options transparent */
        .form-select option {
            background: transparent;
            color: var(--text-primary);
        }
        
        /* Firefox specific */
        .form-select option {
            background-color: var(--bg-primary);
        }
        
        .order-summary {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 2.5rem;
            box-shadow: 0 10px 40px var(--shadow-light);
            height: fit-content;
            position: sticky;
            top: 120px;
        }
        
        .summary-title {
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }
        
        .cart-items {
            margin-bottom: 1.5rem;
        }
        
        .cart-item {
            display: flex;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-light);
        }
        
        .item-image {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            background: var(--input-bg);
        }
        
        .item-details {
            flex: 1;
        }
        
        .item-name {
            font-size: 1.125rem;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }
        
        .item-quantity {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .item-price {
            font-size: 1.125rem;
            text-align: right;
            color: var(--text-primary);
        }
        
        .summary-totals {
            margin-top: 1.5rem;
        }
        
        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            font-size: 1.125rem;
            color: var(--text-primary);
        }
        
        .total-row.grand-total {
            border-top: 2px solid var(--border-medium);
            margin-top: 0.5rem;
            padding-top: 1rem;
            font-size: 1.5rem;
            color: var(--text-primary);
        }
        
        .place-order-btn {
            width: 100%;
            padding: 1.25rem;
            font-size: 1.25rem;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 700;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-heavy);
            margin-top: 1.5rem;
        }
        
        .place-order-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px var(--shadow-heavy);
        }
        
        .place-order-btn:active {
            transform: scale(0.98);
        }
        
        .success-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--popup-overlay);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        .success-modal.show {
            display: flex;
        }
        
        .success-content {
            background: var(--bg-primary);
            padding: 3rem;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 50px var(--shadow-heavy);
        }
        
        .success-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .success-title {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        .success-message {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-weight: 400;
        }
        
        .success-btn {
            padding: 1rem 2rem;
            font-size: 1.125rem;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 700;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .success-btn:hover {
            transform: scale(1.05);
        }
        
        @media (max-width: 768px) {
            .checkout-form,
            .order-summary {
                padding: 1.5rem;
            }
            
            .section-title,
            .summary-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container" onclick="window.location.href='index.html'">
        <img src="L2.png" alt="Malgré" data-image="logo-main">
    </div>
    
    <div class="back-button" onclick="window.location.href='product.html'">
        <svg viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
    </div>
    
    <div class="page-container">
        <div class="checkout-content">
            <div class="checkout-form">
                <form id="checkoutForm">
                    <div class="form-section">
                        <h2 class="section-title">Contact Information</h2>
                        <div class="form-group">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="phone">Phone Number</label>
                            <input type="tel" id="phone" class="form-input" placeholder="+966 5X XXX XXXX" required>
                        </div>
                    </div>
                    
                    <div class="form-section">
                        <h2 class="section-title">Shipping Address</h2>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="firstName">First Name</label>
                                <input type="text" id="firstName" class="form-input" placeholder="First name" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="lastName">Last Name</label>
                                <input type="text" id="lastName" class="form-input" placeholder="Last name" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="address">Address</label>
                            <input type="text" id="address" class="form-input" placeholder="Street address" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="apartment">Apartment, suite, etc. (optional)</label>
                            <input type="text" id="apartment" class="form-input" placeholder="Apartment, suite, etc.">
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="city">City</label>
                                <select id="city" class="form-select" required>
                                    <option value="">Select city</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="country">Country</label>
                                <input type="text" id="country" class="form-input" readonly style="background: rgba(0,0,0,0.1); cursor: not-allowed;">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="postalCode">Postal Code</label>
                            <input type="text" id="postalCode" class="form-input" placeholder="Postal code" required>
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="order-summary">
                <h2 class="summary-title">Order Summary</h2>
                
                <div class="cart-items" id="cartItems">
                </div>
                
                <div class="summary-totals">
                    <div class="total-row">
                        <span>Subtotal</span>
                        <span id="subtotalAmount">0 SAR</span>
                    </div>
                    <div class="total-row">
                        <span>Tax (15%)</span>
                        <span id="taxAmount">0 SAR</span>
                    </div>
                    <div class="total-row">
                        <span>Delivery</span>
                        <span id="deliveryAmount">25 SAR</span>
                    </div>
                    <div class="total-row grand-total">
                        <span>Total</span>
                        <span id="totalAmount">0 SAR</span>
                    </div>
                </div>
                
                <button class="place-order-btn" onclick="proceedToPayment()">Proceed to Payment</button>
            </div>
        </div>
    </div>
    
    <div class="success-modal" id="successModal">
        <div class="success-content">
            <div class="success-icon">✓</div>
            <h2 class="success-title">Order Placed Successfully!</h2>
            <p class="success-message">Thank you for your order. We'll send you a confirmation email shortly.</p>
            <button class="success-btn" onclick="window.location.href='index.html'">Continue Shopping</button>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const selectedCountryCode = localStorage.getItem('selectedCountry') || 'sa';
        
        const countryNames = {
            'sa': 'Saudi Arabia',
            'kw': 'Kuwait'
        };
        
        const selectedCountry = countryNames[selectedCountryCode] || 'Saudi Arabia';
        
        const cities = {
            'Saudi Arabia': [
                'Riyadh', 'Al Kharj', 'Al Majma\'ah', 'Al Zulfi', 'Ad Diriyah', 'Dawadmi', 'Shaqra', 'Afif',
                'Wadi Al-Dawasir', 'Al Quwayiyah', 'Hotat Bani Tamim', 'Al Hariq', 'Al Muzahmiyya', 'Mrat',
                'Thadiq', 'Rumah', 'Dharma', 'Mecca', 'Jeddah', 'Taif', 'Rabigh', 'Khulais', 'Ranyah',
                'Turubah', 'Al Jumum', 'Al Kamil', 'Khurma', 'Adham', 'Al Muwayh', 'Maysan', 'Al Lith',
                'Al Qunfudhah', 'Medina', 'Yanbu', 'Badr', 'Al Ula', 'Mahd adh Dhahab', 'Khaybar',
                'Al Hanakiyah', 'Dammam', 'Al Khobar', 'Dhahran', 'Al Jubail', 'Al Ahsa (Hofuf)',
                'Qatif', 'Ras Tanura', 'Al Mubarraz', 'Al Khafji', 'Abqaiq', 'Safwa', 'Saihat',
                'Al Nairiyah', 'Rahima', 'Udhailiyah', 'Buraidah', 'Unaizah', 'Ar Rass', 'Al Mithnab',
                'Al Bukairiyah', 'Al Badaya', 'Riyadh Al Khabra', 'Al Asyah', 'Al Shammasiya',
                'Uglat Asugour', 'Abha', 'Khamis Mushait', 'Bisha', 'Al Namas', 'Sarat Abidah',
                'Ahad Rafidah', 'Balqarn', 'Rijal Almaa', 'Muhayil', 'Bariq', 'Dhahran Al Janub',
                'Al Majardah', 'Tarib', 'Tabuk', 'Al Wajh', 'Duba', 'Tayma', 'Umluj', 'Haql',
                'Al Bad', 'Timaa', 'Hail', 'Baqaa', 'Al Ghazalah', 'Shamli', 'Al Shinaan', 'Mauqaq',
                'Al Sulaimi', 'Arar', 'Rafha', 'Turaif', 'Al Uwayqilah', 'Jizan', 'Sabya', 'Abu Arish',
                'Samtah', 'Al Darb', 'Baish', 'Al Aridah', 'Farasan', 'Al Raith', 'Damad', 'Al Ardha',
                'Harub', 'Najran', 'Sharourah', 'Habuna', 'Badr Al Janoub', 'Yadamah', 'Khubash',
                'Thar', 'Al Bahah', 'Baljurashi', 'Al Mandaq', 'Al Mikhwah', 'Al Aqiq', 'Al Qura',
                'Qilwah', 'Sabt Al Alaya', 'Sakakah', 'Dumat Al Jandal', 'Qurayyat', 'Tabarjal',
                'Suwayr', 'Al Hazm'
            ],
            'Kuwait': [
                'Al Asimah (Kuwait City)',
                'Hawalli',
                'Al Farwaniyah',
                'Mubarak Al-Kabeer',
                'Al Ahmadi',
                'Al Jahra'
            ]
        };
        
        function initializeCountryAndCities() {
            document.getElementById('country').value = selectedCountry;
            const citySelect = document.getElementById('city');
            const countryCities = cities[selectedCountry] || [];
            
            citySelect.innerHTML = '<option value="">Select city</option>';
            countryCities.forEach(city => {
                const option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                citySelect.appendChild(option);
            });
        }
        
        function displayCartItems() {
            const cartItemsContainer = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="text-align: center; color: var(--text-light);">Your cart is empty</p>';
                return;
            }
            
            cartItemsContainer.innerHTML = '';
            cart.forEach(item => {
                const cartItemHTML = `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}" class="item-image">
                        <div class="item-details">
                            <div class="item-name">${item.name}</div>
                            <div class="item-quantity">Qty: ${item.quantity}</div>
                        </div>
                        <div class="item-price">${(item.price * item.quantity).toLocaleString()} SAR</div>
                    </div>
                `;
                cartItemsContainer.innerHTML += cartItemHTML;
            });
        }
        
        function calculateTotals() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * 0.15;
            const delivery = 25;
            const total = subtotal + tax + delivery;
            
            document.getElementById('subtotalAmount').textContent = subtotal.toLocaleString() + ' SAR';
            document.getElementById('taxAmount').textContent = tax.toFixed(2) + ' SAR';
            document.getElementById('deliveryAmount').textContent = delivery + ' SAR';
            document.getElementById('totalAmount').textContent = total.toFixed(2) + ' SAR';
        }
        
        function proceedToPayment() {
            const form = document.getElementById('checkoutForm');
            
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            
            const orderData = {
                contact: {
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value
                },
                shipping: {
                    firstName: document.getElementById('firstName').value,
                    lastName: document.getElementById('lastName').value,
                    address: document.getElementById('address').value,
                    apartment: document.getElementById('apartment').value,
                    city: document.getElementById('city').value,
                    country: document.getElementById('country').value,
                    postalCode: document.getElementById('postalCode').value
                },
                items: cart,
                timestamp: new Date().toISOString()
            };
            
            localStorage.setItem('pendingOrder', JSON.stringify(orderData));
            
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const tax = subtotal * 0.15;
            const delivery = 25;
            const total = subtotal + tax + delivery;
            
            localStorage.setItem('orderTotal', total.toFixed(2));
            
            window.location.href = 'payment.html';
        }
        
        initializeCountryAndCities();
        displayCartItems();
        calculateTotals();
        
        if (cart.length === 0) {
            setTimeout(() => {
            }, 2000);
        }
    </script>
</body>
</html>
