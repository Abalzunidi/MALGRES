<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Malgré</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="store-colors.css">
    <script src="store-images.js"></script>
    <script src="menu.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 700;
            background-color: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Logo at top center */
        .logo-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            cursor: pointer;
        }
        
        .logo-container img {
            height: 80px;
            width: auto;
        }
        
        /* Menu Button */
        .menu-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: var(--btn-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-heavy);
        }
        
        .menu-button:hover {
            transform: scale(1.1);
        }
        
        .menu-icon {
            width: 24px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .menu-icon span {
            width: 100%;
            height: 2px;
            background: var(--btn-text);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        
        .menu-button.active .menu-icon span:nth-child(1) {
            transform: rotate(45deg) translateY(7px);
        }
        
        .menu-button.active .menu-icon span:nth-child(2) {
            opacity: 0;
        }
        
        .menu-button.active .menu-icon span:nth-child(3) {
            transform: rotate(-45deg) translateY(-7px);
        }
        
        /* Side Menu */
        .side-menu {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 100%;
            height: 85vh;
            max-height: none;
            background: var(--menu-bg);
            box-shadow: 0 -5px 25px var(--shadow-heavy);
            z-index: 999;
            transition: bottom 0.4s ease;
            overflow-y: auto;
            padding: 30px;
            border-radius: 30px 30px 0 0;
        }
        
        .side-menu.active {
            bottom: 0;
        }
        
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--popup-overlay);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        
        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        
        .menu-section {
            margin-bottom: 40px;
        }
        
        .menu-section-title {
            font-size: 14px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .menu-item {
            padding: 15px 20px;
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            font-size: 18px;
            color: var(--text-primary);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        
        .menu-item:hover {
            background: var(--card-hover-bg);
            transform: translateX(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        
        .menu-item.active {
            background: var(--card-active-bg);
            color: var(--card-active-text);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        
        /* Main Content */
        .page-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 120px 2rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        
        .cart-title {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 6px;
            margin-bottom: 1rem;
            text-transform: uppercase;
            text-align: center;
        }
        
        .cart-subtitle {
            font-size: 1.125rem;
            color: var(--text-light);
            margin-bottom: 3rem;
            text-align: center;
        }
        
        /* Empty Cart */
        .empty-cart {
            text-align: center;
            padding: 4rem 2rem;
        }
        
        .empty-cart-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.5;
        }
        
        .empty-cart-text {
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
        
        .continue-shopping-btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            padding: 1rem 2.5rem;
            border-radius: 15px;
            font-size: 1.125rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-medium);
        }
        
        .continue-shopping-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow-heavy);
        }
        
        /* Cart Items */
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .cart-item {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            gap: 1.5rem;
            box-shadow: 0 4px 15px var(--shadow-medium);
            transition: all 0.3s ease;
        }
        
        .cart-item:hover {
            box-shadow: 0 6px 20px var(--shadow-heavy);
        }
        
        .cart-item-image {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--bg-primary);
        }
        
        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .cart-item-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .cart-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }
        
        .cart-item-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .cart-item-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .cart-item-color {
            font-size: 1rem;
            color: var(--text-light);
            margin-bottom: 1rem;
        }
        
        .cart-item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--bg-primary);
            padding: 0.5rem 1rem;
            border-radius: 10px;
        }
        
        .quantity-btn {
            width: 30px;
            height: 30px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .quantity-btn:hover {
            transform: scale(1.1);
        }
        
        .quantity-value {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-primary);
            min-width: 30px;
            text-align: center;
        }
        
        .remove-btn {
            background: transparent;
            color: var(--text-light);
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
            text-decoration: underline;
        }
        
        .remove-btn:hover {
            color: var(--text-primary);
        }
        
        /* Cart Summary */
        .cart-summary {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 4px 15px var(--shadow-medium);
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 1.125rem;
            color: var(--text-secondary);
        }
        
        .summary-row.total {
            border-top: 2px solid var(--text-light);
            padding-top: 1rem;
            margin-top: 1rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .proceed-btn {
            width: 100%;
            background: var(--btn-bg);
            color: var(--btn-text);
            padding: 1.25rem;
            border-radius: 15px;
            font-size: 1.25rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-medium);
        }
        
        .proceed-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--shadow-heavy);
        }
        
        .proceed-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Footer */
        footer {
            padding: 2rem;
            text-align: center;
        }
        
        .footer-text {
            color: var(--text-light);
            font-size: 0.875rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .logo-container img {
                height: 60px;
            }
            
            .menu-button {
                width: 45px;
                height: 45px;
                top: 15px;
                left: 15px;
            }
            
            .side-menu {
                height: 85vh;
                max-height: none;
                padding: 20px;
            }
            
            .page-container {
                padding: 100px 1.5rem 2rem;
            }
            
            .cart-title {
                font-size: 2rem;
                letter-spacing: 4px;
            }
            
            .cart-item {
                flex-direction: column;
                padding: 1.25rem;
            }
            
            .cart-item-image {
                width: 100%;
                height: 200px;
            }
            
            .cart-item-footer {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }
            
            .quantity-control {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Logo -->
    <div class="logo-container" onclick="window.location.href='index.html'">
        <img src="L2.png" alt="Malgré Logo" data-image="logo-main">
    </div>
    
    <!-- Menu Button -->
    <div class="menu-button" id="menuButton" onclick="toggleMenu()">
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>

    <!-- Side Menu -->
    <div class="side-menu" id="sideMenu">
        <!-- Menu content will be loaded by menu.js -->
    </div>
    
    <!-- Main Content -->
    <div class="page-container">
        <h1 class="cart-title">Shopping Cart</h1>
        <p class="cart-subtitle">Review your items before checkout</p>
        
        <div id="cartContent">
            <!-- Cart items will be loaded here -->
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p class="footer-text">© 2026 All Rights Reserved</p>
    </footer>

    <script>
        // Get cart from localStorage
        function getCart() {
            const cart = localStorage.getItem('cart');
            return cart ? JSON.parse(cart) : [];
        }
        
        // Save cart to localStorage
        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }
        
        // Update quantity
        window.updateQuantity = function(productId, change) {
            const cart = getCart();
            const item = cart.find(item => item.id === productId);
            
            if (item) {
                item.quantity += change;
                
                if (item.quantity <= 0) {
                    window.removeFromCart(productId);
                } else {
                    saveCart(cart);
                }
            }
        }
        
        // Remove item from cart
        window.removeFromCart = function(productId) {
            let cart = getCart();
            cart = cart.filter(item => item.id !== productId);
            saveCart(cart);
        }
        
        // Calculate total
        function calculateTotal(cart) {
            return cart.reduce((total, item) => total + (item.price * item.quantity), 0);
        }
        
        // Render cart
        function renderCart() {
            const cart = getCart();
            const cartContent = document.getElementById('cartContent');
            
            if (cart.length === 0) {
                cartContent.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">🛒</div>
                        <div class="empty-cart-text">Your cart is empty</div>
                        <button class="continue-shopping-btn" onclick="window.location.href='products.html'">
                            Continue Shopping
                        </button>
                    </div>
                `;
                return;
            }
            
            const subtotal = calculateTotal(cart);
            const shipping = 0; // Free shipping
            const total = subtotal + shipping;
            
            cartContent.innerHTML = `
                <div class="cart-items">
                    ${cart.map(item => `
                        <div class="cart-item">
                            <div class="cart-item-image">
                                <img src="${item.image}" alt="${item.name}">
                            </div>
                            <div class="cart-item-details">
                                <div class="cart-item-header">
                                    <div class="cart-item-name">${item.name}</div>
                                    <div class="cart-item-price">${item.price} SAR</div>
                                </div>
                                <div class="cart-item-color">Color: ${item.color}</div>
                                <div class="cart-item-footer">
                                    <div class="quantity-control">
                                        <button class="quantity-btn" onclick="updateQuantity('${item.id}', -1)">−</button>
                                        <span class="quantity-value">${item.quantity}</span>
                                        <button class="quantity-btn" onclick="updateQuantity('${item.id}', 1)">+</button>
                                    </div>
                                    <button class="remove-btn" onclick="removeFromCart('${item.id}')">Remove</button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span>${subtotal} SAR</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping</span>
                        <span>Free</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total</span>
                        <span>${total} SAR</span>
                    </div>
                    <button class="proceed-btn" onclick="proceedToPayment()">
                        Proceed to Payment
                    </button>
                </div>
            `;
        }
        
        // Proceed to payment
        // Proceed to payment
        window.proceedToPayment = function() {
            const cart = getCart();
            if (cart.length === 0) return;
            
            // Redirect to checkout page
            window.location.href = 'checkout.html';
        }
        
        // Initialize
        renderCart();
    </script>
</body>
</html>
