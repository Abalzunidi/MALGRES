<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry - Malgré</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="store-colors.css">
    <script src="store-images.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 700;
            background-color: var(--bg-primary);
            min-height: 100vh;
        }
        
        .page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-top: 100px;
            padding-bottom: 3rem;
        }
        
        /* Logo at top center */
        .logo-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            cursor: pointer;
        }
        
        .logo-container img {
            height: 80px;
            width: auto;
        }
        
        /* Back Button */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: var(--btn-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-heavy);
        }
        
        .back-button:hover {
            transform: scale(1.1);
        }
        
        .back-button svg {
            width: 24px;
            height: 24px;
            fill: var(--btn-text);
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .inquiry-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 30px;
            padding: 3rem 2rem;
            box-shadow: 0 10px 40px var(--shadow-light);
        }
        
        .inquiry-title {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }
        
        .inquiry-subtitle {
            font-size: 1.125rem;
            text-align: center;
            margin-bottom: 2.5rem;
            color: var(--text-secondary);
            font-weight: 400;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            font-size: 1.125rem;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }
        
        .form-input,
        .form-textarea {
            width: 100%;
            padding: 1rem;
            font-size: 1.125rem;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 600;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 15px;
            transition: all 0.3s ease;
            color: var(--input-text);
        }
        
        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--input-focus-border);
            background: var(--input-focus-bg);
        }
        
        .form-input::placeholder,
        .form-textarea::placeholder {
            color: var(--input-placeholder);
        }
        
        .form-textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        .submit-button {
            width: 100%;
            padding: 1rem;
            font-size: 1.25rem;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 700;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-heavy);
            margin-top: 1rem;
        }
        
        .submit-button:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px var(--shadow-heavy);
        }
        
        .submit-button:active {
            transform: scale(0.98);
        }
        
        .success-message {
            background: var(--success-bg);
            color: var(--success-text);
            padding: 1rem;
            border-radius: 15px;
            margin-bottom: 1.5rem;
            text-align: center;
            display: none;
            font-size: 1rem;
        }
        
        .success-message.show {
            display: block;
            animation: slideDown 0.4s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .inquiry-container {
                padding: 2rem 1.5rem;
            }
            
            .inquiry-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Logo -->
    <div class="logo-container" onclick="window.location.href='index.html'">
        <img src="L1.png" alt="Malgré" data-image="logo-main">
    </div>
    
    <!-- Back Button -->
    <div class="back-button" onclick="window.location.href='index.html'">
        <svg viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
    </div>
    
    <div class="page-container">
        <div class="main-content">
            <div class="inquiry-container">
                <h1 class="inquiry-title">Inquiry</h1>
                <p class="inquiry-subtitle">We'd love to hear from you. Send us your questions or feedback.</p>
                
                <div class="success-message" id="successMessage">
                    Thank you! Your inquiry has been submitted successfully.
                </div>
                
                <form onsubmit="handleSubmit(event)">
                    <div class="form-group">
                        <label class="form-label" for="name">Name</label>
                        <input 
                            type="text" 
                            id="name" 
                            class="form-input" 
                            placeholder="Enter your name"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="phone">Phone Number</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            class="form-input" 
                            placeholder="Enter your phone number"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            class="form-input" 
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="inquiry">Your Inquiry</label>
                        <textarea 
                            id="inquiry" 
                            class="form-textarea" 
                            placeholder="Write your message here..."
                            required
                        ></textarea>
                    </div>
                    
                    <button type="submit" class="submit-button">Submit</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Handle Form Submit
        function handleSubmit(event) {
            event.preventDefault();
            
            // Get form values
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const inquiry = document.getElementById('inquiry').value;
            
            // في الإنتاج، راح ترسل البيانات لقاعدة بيانات أو API
            console.log({
                name,
                phone,
                email,
                inquiry,
                timestamp: new Date().toISOString()
            });
            
            // Show success message
            const successMessage = document.getElementById('successMessage');
            successMessage.classList.add('show');
            
            // Clear form
            document.getElementById('name').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('email').value = '';
            document.getElementById('inquiry').value = '';
            
            // Hide success message after 5 seconds
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 5000);
            
            // Scroll to top
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
